services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: warehouse
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10
