saas_revenue_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', '127.0.0.1') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'warehouse') }}"
      password: "{{ env_var('PGPASSWORD', 'local_demo_only') }}"
      dbname: "{{ env_var('PGDATABASE', 'warehouse') }}"
      schema: analytics
      threads: 1
      sslmode: "{{ env_var('PGSSLMODE', 'prefer') }}"
